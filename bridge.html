<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponte del registratore</title>
<style>
  body { margin: 0; padding: 8px 10px; font: 13px/1.4 system-ui, sans-serif; background: #1E222B; color: #EEF0F3; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 0; background: #A9A3F2; color: #15131F; font-weight: 600; }
  #st { margin-top: 6px; opacity: .85; }
</style></head><body>
<!-- Ponte fra il Quaderno (dentro claude.ai) e la scheda del registratore. Dentro claude.ai le due schede non si possono
     tenere per mano (window.open vuoto, niente opener): questa pagina, incorporata nel Quaderno, chiede a Chrome l'accesso
     ai dati non partizionati del suo sito (Storage Access API) e usa un BroadcastChannel, che la scheda del registratore
     sente perché è sullo stesso sito. Per ora è una prova: riporta al Quaderno l'esito di ogni passaggio. -->
<button id="go">Consenti il collegamento col registratore</button>
<div id="st">Tocca il pulsante: Chrome può chiederti il permesso.</div>
<script>
(() => {
  const VERSION = '2026-09-30.5';
  const tell = (type, data) => { try { parent.postMessage(Object.assign({ source: 'quaderno-bridge', type, v: VERSION }, data || {}), '*'); } catch (e) {} };
  const st = t => { document.getElementById('st').textContent = t; };
  const hasSAA = typeof document.requestStorageAccess === 'function';
  (async () => {
    let has = null; try { has = await document.hasStorageAccess(); } catch (e) { has = 'errore ' + (e.name || e); }
    tell('loaded', { hasSAA, hasAccess: has, sandboxed: (() => { try { return !!window.frameElement && window.frameElement.sandbox.length > 0; } catch (e) { return 'n/d'; } })() });
  })();
  let bc = null;
  document.getElementById('go').addEventListener('click', async () => {
    // con il permesso il canale è quello non partizionato del sito (lo sente la scheda del registratore); senza, si prova
    // comunque il canale normale, che funziona solo se il browser non separa i dati (stesso sito, prove locali)
    let handle = null;
    if (!hasSAA) tell('step', { step: 'saa', ok: false, error: 'API assente' });
    else {
      try { handle = await document.requestStorageAccess({ BroadcastChannel: true }); }
      catch (e) { tell('step', { step: 'saa', ok: false, error: (e.name || '') + ': ' + (e.message || e) }); }
      if (handle && typeof handle.BroadcastChannel !== 'function') { tell('step', { step: 'saa', ok: false, error: 'permesso senza canale condiviso' }); handle = null; }
      else if (handle) tell('step', { step: 'saa', ok: true });
    }
    try { bc = handle ? handle.BroadcastChannel('quaderno-bridge') : new BroadcastChannel('quaderno-bridge'); } catch (e) { st('Canale non disponibile: ' + (e.message || e)); tell('step', { step: 'pong', ok: false, error: 'canale non disponibile' }); return; }
    bc.onmessage = ev => { const d = ev.data || {}; if (d.type === 'pong') { st('Collegato alla scheda del registratore (v ' + (d.v || '?') + ').'); tell('step', { step: 'pong', ok: true, recV: d.v }); } };
    st(handle ? 'Permesso dato. Cerco la scheda del registratore…' : 'Senza permesso: provo lo stesso a cercare la scheda del registratore…');
    let n = 0; const t = setInterval(() => { if (++n > 20) { clearInterval(t); tell('step', { step: 'pong', ok: false, error: 'nessuna risposta in 20 s: la scheda del registratore è aperta?' }); return; } bc.postMessage({ type: 'ping', v: VERSION }); }, 1000);
    bc.addEventListener('message', ev => { if (ev.data && ev.data.type === 'pong') clearInterval(t); });
  });
})();
</script>
</body></html>
